[package]
name = "crabber"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "crabber"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
gpui-kit = "0.7.3"
tokio-xmpp = { version = "6", default-features = false, features = ["starttls", "ring", "rustls-native-certs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
futures = "0.3"
webrtc = "0.21"
cpal = "0.18"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
chrono = "0.4"
dirs = "7"
keyring = "4"
sasl = "0.5"
tokio-rustls = { version = "0.26", default-features = false }
rustls-native-certs = "0.8"
rtc = { version = "0.21", default-features = false }
async-trait = "0.1"
bytes = "1"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
raw-window-handle = "0.6"
# OMEMO (libsignal-compatible) and file encryption
x25519-dalek = { version = "3", features = ["static_secrets"] }
curve25519-dalek = "5"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
aes-gcm = "0.11"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
getrandom = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pgp = "0.21"
rand = "0.8"
emojis = "0.9.1"
unsafe-libopus = "0.2.0"
ogg = "0.9.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
notify-rust = "4"

[profile.release]
strip = true

# Debug builds stay debuggable, but gpui & co. are ~10x faster optimized: smooth scrolling under `cargo run`.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
# TestAppContext for UI tests (gpui-kit re-exports this crate as its gpui).
gpui-pre = { version = "0.3.9", features = ["test-support"] }
