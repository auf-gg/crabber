[package]
name = "crabber"
version = "0.7.5"
edition = "2024"
license = "MIT"

[[bin]]
name = "crabber"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
gpui-kit = "0.9.0"
# Only to enable tree-sitter grammar features on the gpui-component instance gpui-kit uses
# (no umbrella: its sql grammar pins cc ~1.2.1, conflicting with the rest of the tree).
gpui-component = { version = "0.9.0", features = [
    "tree-sitter",
    "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cmake", "tree-sitter-cpp", "tree-sitter-csharp",
    "tree-sitter-css", "tree-sitter-diff", "tree-sitter-elixir", "tree-sitter-go", "tree-sitter-graphql",
    "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript", "tree-sitter-kotlin", "tree-sitter-lua",
    "tree-sitter-make", "tree-sitter-markdown", "tree-sitter-php", "tree-sitter-proto", "tree-sitter-python",
    "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-scala", "tree-sitter-swift", "tree-sitter-toml",
    "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml", "tree-sitter-zig",
] }
tokio-xmpp = { version = "6", default-features = false, features = ["starttls", "ring", "rustls-native-certs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
futures = "0.3"
webrtc = "0.21"
cpal = "0.18"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
chrono = "0.4"
dirs = "7"
keyring = "4"
sasl = "0.5"
tokio-rustls = { version = "0.26", default-features = false }
rustls-native-certs = "0.8"
rtc = { version = "0.21", default-features = false }
async-trait = "0.1"
bytes = "1"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
raw-window-handle = "0.6"
# OMEMO (libsignal-compatible) and file encryption
x25519-dalek = { version = "3", features = ["static_secrets"] }
curve25519-dalek = "5"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
aes-gcm = "0.11"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
getrandom = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pgp = "0.21"
rand = "0.8"
emojis = "0.9.1"
unsafe-libopus = "0.2.0"
ogg = "0.9.2"
sys-locale = "0.3"
nnnoiseless = { version = "0.5", default-features = false }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Power", "Win32_Storage_Xps", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture"] }
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
# PipeWire nodes (real device names, headsets) for the device choice in settings.
cpal = { version = "0.18", features = ["pipewire"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
pipewire = "0.10"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
ksni = { version = "0.3", features = ["blocking"] }
notify-rust = "4"

[profile.release]
strip = true

# Debug builds stay debuggable, but gpui & co. are ~10x faster optimized: smooth scrolling under `cargo run`.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
# TestAppContext for UI tests (gpui-kit re-exports this crate as its gpui).
gpui-pre = { version = "0.3.11", features = ["test-support"] }

[patch.crates-io]
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
