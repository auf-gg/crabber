# Keeps AUR packages in sync with this repository:
#   crabber-git (dist/PKGBUILD-git) — on pushes to main / v* tags;
#     the version is computed by pkgver() from the PKGBUILD itself.
#   crabber-bin (dist/PKGBUILD-bin) — on v* tag pushes (and manual runs with
#     a tag input); the version comes from the tag, sha256 checksums are
#     computed from the release files. Releases are created by build.yml
#     with GITHUB_TOKEN, and such events never trigger other workflows,
#     so this job polls until the release assets are downloadable.
#
# Required secret: AUR_SSH_PRIVATE_KEY — private SSH key of your AUR account:
#   ssh-keygen -f aur_key
#   add the public aur_key.pub at https://aur.archlinux.org/ (My Account)
# The first push to an empty <package>.git repository creates the AUR package.

name: Update AUR packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish crabber-bin from (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: aur-update
  cancel-in-progress: false

jobs:
  git-package:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel  # makepkg is required to generate .SRCINFO
    steps:
      - name: Install git and openssh
        run: pacman -Sy --noconfirm archlinux-keyring git openssh

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pkgver() needs the full history
          fetch-tags: true

      - name: Set up AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "${AUR_SSH_PRIVATE_KEY// }" ]]; then
            echo "::error::Secret AUR_SSH_PRIVATE_KEY is not set. Run ssh-keygen -f aur_key, add aur_key.pub to your AUR account and the private key as a repository secret."
            exit 1
          fi
          install -dm700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur_key"
          chmod 600 "$HOME/.ssh/aur_key"
          # AUR ed25519 host key, pinned so host verification never depends
          # on ssh-keyscan succeeding inside the container.
          printf '%s\n' \
            'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > "$HOME/.ssh/known_hosts"
          # Explicit paths via GIT_SSH_COMMAND: no reliance on ssh_config lookups.
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/aur_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Publish crabber-git
        run: |
          set -euo pipefail
          # Workspace files are owned by a different UID; AUR clone is chowned
          # to builduser for makepkg. Trust all repos in this ephemeral runner.
          git config --global --add safe.directory '*'
          git clone ssh://aur@aur.archlinux.org/crabber-git.git aur

          cp dist/PKGBUILD-git aur/PKGBUILD

          # Compute the version with pkgver() from the PKGBUILD itself,
          # pointing srcdir at the checked-out repository.
          srcdir="$(mktemp -d)"
          source aur/PKGBUILD
          ln -s "$GITHUB_WORKSPACE" "$srcdir/$_gitname"
          new_pkgver="$(srcdir="$srcdir" pkgver)"
          echo "New pkgver: $new_pkgver"

          sed -i "s/^pkgver=.*/pkgver=${new_pkgver}/; s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD

          # makepkg refuses to run as root
          useradd -m builduser
          chown -R builduser:builduser aur
          (
            cd aur
            runuser -u builduser -- makepkg --printsrcinfo > .SRCINFO
          )

          cd aur
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "AUR package is already up to date, nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          git commit -m "chore: update crabber-git to ${new_pkgver}"
          git push origin HEAD:master

  bin-package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git and openssh
        run: pacman -Sy --noconfirm archlinux-keyring git openssh

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "${AUR_SSH_PRIVATE_KEY// }" ]]; then
            echo "::error::Secret AUR_SSH_PRIVATE_KEY is not set. Run ssh-keygen -f aur_key, add aur_key.pub to your AUR account and the private key as a repository secret."
            exit 1
          fi
          install -dm700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur_key"
          chmod 600 "$HOME/.ssh/aur_key"
          # AUR ed25519 host key, pinned so host verification never depends
          # on ssh-keyscan succeeding inside the container.
          printf '%s\n' \
            'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > "$HOME/.ssh/known_hosts"
          # Explicit paths via GIT_SSH_COMMAND: no reliance on ssh_config lookups.
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/aur_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Publish crabber-bin
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Workspace files are owned by a different UID; AUR clone is chowned
          # to builduser for makepkg. Trust all repos in this ephemeral runner.
          git config --global --add safe.directory '*'
          version="${RELEASE_TAG#v}"

          # The release is published by the release job of build.yml after all
          # builds finish; wait until both Linux assets are downloadable.
          urlbase="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}"
          for i in $(seq 1 30); do
            if curl -fsI "${urlbase}/crabber-${version}-x86_64-linux.tar.gz" >/dev/null 2>&1 \
               && curl -fsI "${urlbase}/crabber-${version}-aarch64-linux.tar.gz" >/dev/null 2>&1; then
              break
            fi
            echo "Release assets for v${version} are not ready yet (attempt ${i}/30), waiting 60s..."
            sleep 60
          done

          sum_x86_64="$(curl -fsSL "${urlbase}/crabber-${version}-x86_64-linux.tar.gz" | sha256sum | cut -d' ' -f1)"
          sum_aarch64="$(curl -fsSL "${urlbase}/crabber-${version}-aarch64-linux.tar.gz" | sha256sum | cut -d' ' -f1)"
          echo "crabber-bin ${version}: x86_64=${sum_x86_64} aarch64=${sum_aarch64}"

          git clone ssh://aur@aur.archlinux.org/crabber-bin.git aur
          cp dist/PKGBUILD-bin aur/PKGBUILD

          sed -i \
            -e "s/^pkgver=.*/pkgver=${version}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${sum_x86_64}')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${sum_aarch64}')/" \
            aur/PKGBUILD

          useradd -m builduser
          chown -R builduser:builduser aur
          (
            cd aur
            runuser -u builduser -- makepkg --printsrcinfo > .SRCINFO
          )

          cd aur
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "AUR package is already up to date, nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          git commit -m "chore: update crabber-bin to ${version}"
          git push origin HEAD:master
